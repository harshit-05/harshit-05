  .c { font: 600 11px ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #0969da; }
  .k1 { animation: k1 9s infinite; } .k2 { animation: k2 9s infinite; }
  .k3 { animation: k3 9s infinite; } .k4 { animation: k4 9s infinite; }
  @keyframes k1 { 0%,4% { opacity: 0; } 8%,92% { opacity: 1; } 100% { opacity: 0; } }
  @keyframes k2 { 0%,18% { opacity: 0; } 24%,92% { opacity: 1; } 100% { opacity: 0; } }
