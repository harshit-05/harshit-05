  .mono { font: 400 16px ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #8b949e; }
  .cmd { font: 500 18px ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace; fill: #3fb950; }
  .fade { opacity: 0; animation: in .8s ease-out forwards; }
  .d1 { animation-delay: .1s; } .d2 { animation-delay: .35s; }
  @keyframes in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
  .cur { animation: blink 1s steps(1) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
</style>
